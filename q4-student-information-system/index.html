<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Information System</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- My own CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0">Student Information System</span>
    </div>
  </nav>

  <main class="container my-4">

    <!-- Messages come here -->
    <div id="msg" role="alert"></div>

    <div class="row">

      <!-- Left side: form to add or edit a student -->
      <div class="col-12 col-lg-4 mb-4">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span id="formTitle">Add New Student</span>
            <button type="button" id="toggleForm" class="btn btn-sm btn-light">Hide/Show</button>
          </div>
          <div class="card-body" id="formBody">
            <form id="studentForm">
              <div class="mb-3">
                <label for="roll" class="form-label">Roll Number</label>
                <input type="text" id="roll" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="name" class="form-label">Student Name</label>
                <input type="text" id="name" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="course" class="form-label">Course</label>
                <select id="course" class="form-select">
                  <option>B.Tech</option>
                  <option>BCA</option>
                  <option>B.Sc</option>
                  <option>MBA</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
              </div>
              <button type="submit" id="saveBtn" class="btn btn-primary">Add Student</button>
              <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Right side: student table -->
      <div class="col-12 col-lg-8">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <h2 class="h5 mb-0">Student List (Total: <span id="total">0</span>)</h2>
          <input type="search" id="searchBox" class="form-control w-auto"
                 placeholder="Search by name" aria-label="Search students by name">
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-striped" id="studentTable">
            <thead class="table-dark">
              <tr>
                <th>Roll No</th><th>Name</th><th>Course</th><th>Email</th><th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <button type="button" id="clearAll" class="btn btn-outline-danger btn-sm">
          Remove All Students
        </button>
      </div>

    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-4">
    <p class="mb-0">&copy; 2026 Student Information System | Made by Harshil</p>
  </footer>

  <!-- jQuery, Bootstrap JS and my script (order is important) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
